version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: htr_postgres
    restart: always
    environment:
      POSTGRES_DB: htr_db
      POSTGRES_USER: htr_user
      POSTGRES_PASSWORD: htr_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: htr_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo_data &&
             gunicorn --config gunicorn.conf.py config.wsgi:application"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=production-secret-key-replace-in-real-deployment
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DATABASE_URL=postgres://htr_user:htr_password@db:5432/htr_db
      - OCR_ENGINE=easyocr
    depends_on:
      - db

volumes:
  postgres_data:
